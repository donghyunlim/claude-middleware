apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
spec:
  template:
    spec:
      containers:
        - name: api
          image: registry.example.com/payments-api:2026.11.02
          env:
            - name: APP_ENV
              value: production
            - name: PAYMENT_MAX_ATTEMPTS
              value: "4"
